# EliteStocks TV - mpv portable input.conf
# Matches the on-screen control layout: <<10 / play-pause / 10>> plus
# Episodes, Audio & Subtitles, Next episode (handled by uosc buttons below).

SPACE    cycle pause
ESC      quit
BS       quit
RIGHT    seek 10
LEFT     seek -10
UP       seek 60
DOWN     seek -60
f        cycle fullscreen
m        cycle mute
j        cycle sub
J        cycle sub down
Shift+a  cycle audio
>        playlist-next
<        playlist-prev
