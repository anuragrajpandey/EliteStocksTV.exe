# EliteStocks TV - mpv portable config
# This file lives next to mpv.exe (portable_config), so it only affects mpv
# when launched by the app - it does not touch any system-wide mpv install.

# --- Playback / decoding ---
hwdec=auto-safe
vo=gpu
gpu-context=d3d11
video-sync=display-resample
cache=yes
demuxer-max-bytes=64MiB
demuxer-readahead-secs=15
network-timeout=15

# --- Subtitles ---
sub-auto=fuzzy
sub-font-size=42
sub-color="#FFFFFF"
sub-border-color="#000000"
sub-border-size=2.5
sub-shadow-offset=1

# --- Window / UI ---
osc=no                 # uosc (in scripts/) replaces the built-in OSC
osd-bar=no
border=no
keep-open=yes
idle=yes
cursor-autohide=1000
title=EliteStocks TV - ${media-title}

# --- Live TV friendliness ---
# Live streams sometimes have irregular timestamps; be forgiving.
untimed=no
demuxer-lavf-o-add=fflags=+genpts
