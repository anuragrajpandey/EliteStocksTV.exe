# EliteStocks TV - uosc theme
# uosc (https://github.com/tomasklaen/uosc) draws the on-screen player UI:
# progress bar, play/pause, seek buttons, and the Audio/Subtitles + playlist
# ("Episodes" / "Next episode") menus that satisfy the Netflix-style layout.
#
# If a mpv/uosc version you use renamed or dropped an option below, it is
# simply ignored - nothing breaks. See the uosc README for the authoritative,
# version-matched option list if you want to fine tune this further.

# Layout
top_bar=no-border
window_border=no
title=${media-title}
autohide=yes
pause_indicator=flash

# Bottom control row: skip back 10s, play/pause, skip fwd 10s, then
# Episodes (playlist), Subtitles, Audio, Next episode, Fullscreen
controls=<has_many_audio>audio,<has_many_sub>subtitles,<gap>,items,loop-playlist,<gap>,speed,<gap>,fullscreen

# Timeline
timeline_style=line
timeline_size_min=3
timeline_size_max=8
timeline_persistency=paused

# EliteStocks brand accent (orange) applied to the progress bar / highlights
color_foreground=ff9900
color_foreground_text=111111
color_background=0a0a0a
color_background_text=ffffff

# Playlist panel doubles as "Episodes" when a series is queued
playlist_layout=normal
